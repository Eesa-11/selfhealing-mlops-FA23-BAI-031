groups:
  - name: MLDriftAlerts
    rules:
      - alert: ModelConfidenceDrift
        expr: prediction_confidence_score < 0.613
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ML model confidence has dropped below threshold"
          description: "prediction_confidence_score is {{ $value }} which is below the threshold. Triggering rollback to stable."
