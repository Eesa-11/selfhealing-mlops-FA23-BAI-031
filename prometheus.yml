global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Load alert rules
rule_files:
  - "alert.rules.yml"

# Alertmanager connection
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 172.31.38.96:9093

# Scrape jobs
scrape_configs:

  # Scrape our custom ML exporter running on EC2 port 8000
  - job_name: 'sentiment-ml-exporter'
    static_configs:
      - targets: ['172.31.38.96:8000']
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
